<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>FAVORITE 9</title><link rel="stylesheet" href="style.css"></head><body><main>
<section id="home" class="screen active"><div class="eyebrow">IDOL FACE SORT</div><h1>FAVORITE <span>9</span></h1><p class="lead">あなたの「好きな顔」TOP 9を決めよう。</p><div class="modes"><button class="mode" data-mode="standard"><b>01</b><strong>STANDARD SORT</strong><small>じっくり比較して順位を決定</small></button><button class="mode" data-mode="quick"><b>02</b><strong>QUICK SORT</strong><small>少ない比較で短時間に決定</small></button></div><p class="note">写真はブラウザ内だけで処理されます。</p></section>
<section id="sort" class="screen"><header><button id="back">← BACK</button><div class="progress"><div id="mode"></div><b id="count">0 / 0</b><i><em id="bar"></em></i></div><button id="restart">RESTART</button></header><div class="pair"><button class="person" id="left"><div class="photo"><img id="li"></div><small id="lg"></small><strong id="ln"></strong></button><div class="vs">VS</div><button class="person" id="right"><div class="photo"><img id="ri"></div><small id="rg"></small><strong id="rn"></strong></button></div><div class="choices choices-v2"><div class="like-slot"><button id="lv" class="love">♡♡&nbsp; LOVE</button><button id="ll">♡&nbsp; LIKE</button></div><div class="like-slot"><button id="rv" class="love">♡♡&nbsp; LOVE</button><button id="rl">♡&nbsp; LIKE</button></div><div class="secondary-actions"><button id="bothlove" class="love">♡♡&nbsp; BOTH</button><button id="both">BOTH</button><button id="skip">SKIP</button></div></div><p class="hint">好きな顔を直感で選んでください。LOVEは「めちゃくちゃ好き」で通常より強く順位に反映されます。BOTHは「どっちも好き」、♡♡ BOTHは「どっちもめちゃくちゃ好き」でより強く反映されます。SKIPは評価を変えずに進みます。</p></section>
<section id="result" class="screen"><div class="resultHead"><div class="eyebrow">YOUR RESULT</div><h2>FAVORITE <span>9</span></h2><p id="resultMode"></p></div><div id="grid" class="grid"></div><div class="resultBtns"><button id="save">SAVE RESULT IMAGE</button><button id="again">PLAY AGAIN</button></div></section></main><canvas id="canvas" hidden></canvas><script src="data.js"></script><script src="app.js"></script></body></html>
